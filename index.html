<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Nilesh Chauhan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Layout: sticky pill nav, hero card with drifting colour blobs and
     a rotating gradient ring around a small portrait, a scrolling
     tech ticker, then a bento grid of cards that rise in on scroll.
     Palette: cool light ground, white cards, cobalt to mint gradient
     accent, one warm orange spark. Type: Bricolage Grotesque for
     display, Plus Jakarta Sans for body, JetBrains Mono for labels.
     ============================================================ */
  :root{
    --bg:#f2f6fc;
    --card:#ffffff;
    --card-2:#eef3fb;
    --ink:#0e1a2e;
    --ink-soft:#44536b;
    --muted:#7886a0;
    --line:rgba(14,26,46,.08);
    --line-strong:rgba(14,26,46,.16);
    --accent:#2b6cff;
    --accent-ink:#ffffff;
    --accent-soft:rgba(43,108,255,.10);
    --mint:#0fb59a;
    --mint-soft:rgba(15,181,154,.12);
    --spark:#ff8a4c;
    --grad:linear-gradient(120deg,#2b6cff 0%,#0fb59a 100%);
    --shadow:0 1px 2px rgba(14,26,46,.04), 0 10px 30px -14px rgba(30,60,120,.22);
    --shadow-hover:0 2px 4px rgba(14,26,46,.05), 0 22px 44px -16px rgba(30,70,160,.34);
    --blob-a:rgba(43,108,255,.28);
    --blob-b:rgba(15,181,154,.26);
    --blob-c:rgba(255,138,76,.20);
    --font-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-body:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a111f; --card:#111b2f; --card-2:#17233b;
      --ink:#e9f0fc; --ink-soft:#b3c0d8; --muted:#7f8da8;
      --line:rgba(233,240,252,.09); --line-strong:rgba(233,240,252,.18);
      --accent:#6c9bff; --accent-ink:#06101f; --accent-soft:rgba(108,155,255,.14);
      --mint:#2dd4b6; --mint-soft:rgba(45,212,182,.14); --spark:#ff9d66;
      --grad:linear-gradient(120deg,#6c9bff 0%,#2dd4b6 100%);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
      --shadow-hover:0 2px 4px rgba(0,0,0,.5), 0 22px 44px -16px rgba(0,0,0,.7);
      --blob-a:rgba(108,155,255,.22); --blob-b:rgba(45,212,182,.18); --blob-c:rgba(255,157,102,.14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a111f; --card:#111b2f; --card-2:#17233b;
    --ink:#e9f0fc; --ink-soft:#b3c0d8; --muted:#7f8da8;
    --line:rgba(233,240,252,.09); --line-strong:rgba(233,240,252,.18);
    --accent:#6c9bff; --accent-ink:#06101f; --accent-soft:rgba(108,155,255,.14);
    --mint:#2dd4b6; --mint-soft:rgba(45,212,182,.14); --spark:#ff9d66;
    --grad:linear-gradient(120deg,#6c9bff 0%,#2dd4b6 100%);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-hover:0 2px 4px rgba(0,0,0,.5), 0 22px 44px -16px rgba(0,0,0,.7);
    --blob-a:rgba(108,155,255,.22); --blob-b:rgba(45,212,182,.18); --blob-c:rgba(255,157,102,.14);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top:90px;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }
  body::before{
    content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
    background:var(--bg); z-index:40;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:700; letter-spacing:-.02em; text-wrap:balance; margin:0; color:var(--ink);}
  p{margin:0;}
  a{color:inherit;}
  img{max-width:100%; display:block;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .wrap{max-width:1060px; margin:0 auto;}

  /* scroll progress */
  .progress{
    position:fixed; left:0; right:0; top:env(safe-area-inset-top,0px); height:3px; z-index:41;
    background:transparent; pointer-events:none;
  }
  .progress i{display:block; height:100%; width:100%; background:var(--grad); transform:scaleX(0); transform-origin:left;}

  /* ---------- nav ---------- */
  .nav{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 10px); z-index:30; margin-top:14px;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:9px 10px 9px 20px; border-radius:999px;
    background:color-mix(in srgb, var(--card) 82%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); box-shadow:var(--shadow);
  }
  .brand{font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-.02em; white-space:nowrap;}
  .brand b{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .navlinks{display:flex; gap:2px; font-size:13.5px; font-weight:500; min-width:0;}
  .navlinks a{text-decoration:none; color:var(--ink-soft); padding:8px 13px; border-radius:999px; transition:background .2s, color .2s;}
  .navlinks a:hover{color:var(--accent); background:var(--accent-soft);}
  .navlinks a.active{color:var(--accent); background:var(--accent-soft);}
  @media (max-width:820px){ .navlinks{display:none;} }

  .btn{
    font-family:var(--font-body); font-weight:600; font-size:14px; text-decoration:none;
    padding:11px 20px; border-radius:999px; border:1px solid var(--line-strong);
    display:inline-flex; align-items:center; gap:8px; color:var(--ink); background:transparent;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s, color .2s;
    cursor:pointer;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-solid{background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 10px 22px -10px rgba(43,108,255,.65);}
  .btn-solid:hover{box-shadow:0 16px 28px -10px rgba(43,108,255,.75);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .nav .btn{padding:9px 18px; flex:none;}
  .btn .arr{transition:transform .2s ease;}
  .btn:hover .arr{transform:translateX(3px);}

  /* ---------- cards ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:26px; box-shadow:var(--shadow); min-width:0; position:relative;
    transition:transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s ease, border-color .3s ease;
  }
  .card:hover{transform:translateY(-4px); box-shadow:var(--shadow-hover); border-color:color-mix(in srgb, var(--accent) 35%, var(--line));}
  .card-title{
    font-family:var(--font-mono); font-size:12px; font-weight:500; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent); display:flex; align-items:center; gap:9px; margin-bottom:14px;
  }
  .card-title::before{content:""; width:18px; height:3px; border-radius:3px; background:var(--grad);}

  .sec{padding-top:56px; scroll-margin-top:90px;}
  .sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .sec-head h2{font-size:clamp(28px,4.4vw,40px); line-height:1.1;}
  .sec-head h2::after{content:""; display:block; width:48px; height:4px; border-radius:4px; background:var(--grad); margin-top:10px;}
  .sec-head .tag{font-family:var(--font-mono); font-size:12px; color:var(--muted);}

  .chips{display:flex; flex-wrap:wrap; gap:8px; min-width:0;}
  .chip{
    font-family:var(--font-mono); font-size:12.5px; font-weight:500; padding:7px 12px; border-radius:10px;
    background:var(--card-2); border:1px solid var(--line); color:var(--ink-soft);
    transition:transform .2s ease, background .2s, color .2s, border-color .2s;
  }
  .chip:hover{transform:translateY(-2px); background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, transparent);}

  /* ---------- scroll reveal (content stays visible, only moves) ---------- */
  .rv{transition:transform .8s cubic-bezier(.2,.7,.2,1);}
  .js .rv:not(.in){transform:translateY(26px) scale(.985);}

  /* ---------- hero ---------- */
  .hero{
    margin-top:16px; padding:34px; border-radius:30px; overflow:hidden; isolation:isolate;
    display:grid; grid-template-columns:auto 1fr; gap:34px; align-items:center;
  }
  .hero:hover{transform:none; box-shadow:var(--shadow); border-color:var(--line);}
  .blob{position:absolute; border-radius:50%; filter:blur(54px); z-index:-1; will-change:transform;}
  .blob.a{width:340px; height:340px; background:var(--blob-a); right:-70px; top:-110px; animation:drift1 16s ease-in-out infinite;}
  .blob.b{width:300px; height:300px; background:var(--blob-b); right:140px; bottom:-170px; animation:drift2 19s ease-in-out infinite;}
  .blob.c{width:200px; height:200px; background:var(--blob-c); left:-60px; bottom:-90px; animation:drift1 22s ease-in-out infinite reverse;}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-40px,30px) scale(1.12);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(36px,-34px) scale(.92);}}

  .portrait{
    width:150px; aspect-ratio:4/5; border-radius:26px; padding:3px; position:relative; overflow:hidden;
    box-shadow:0 18px 34px -16px rgba(30,70,160,.5);
  }
  .portrait::before{
    content:""; position:absolute; left:50%; top:50%; width:240%; aspect-ratio:1; translate:-50% -50%;
    background:conic-gradient(from 0deg, #2b6cff, #0fb59a, #ff8a4c, #2b6cff);
    animation:spin 6s linear infinite;
  }
  .portrait img{
    position:relative; width:100%; height:100%; object-fit:cover; object-position:center top;
    border-radius:23px; background:var(--card);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .status{
    display:inline-flex; align-items:center; gap:9px; font-size:12.5px; font-weight:600;
    color:var(--mint); background:var(--mint-soft); padding:6px 13px; border-radius:999px; margin-bottom:14px;
  }
  .live{position:relative; width:8px; height:8px; border-radius:50%; background:var(--mint);}
  .live::after{content:""; position:absolute; inset:0; border-radius:50%; background:var(--mint); animation:ping 1.8s ease-out infinite;}
  @keyframes ping{0%{transform:scale(1); opacity:.7;} 100%{transform:scale(3.2); opacity:0;}}

  .hero h1{font-size:clamp(38px,6.6vw,64px); line-height:1.02;}
  .hero h1 .grad{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .role{font-family:var(--font-mono); font-size:15px; color:var(--ink-soft); margin-top:12px; min-height:1.6em; display:flex; align-items:center; gap:2px; flex-wrap:wrap;}
  .role .pre{color:var(--muted); margin-right:6px;}
  .role #typed{color:var(--accent); font-weight:600;}
  .caret{display:inline-block; width:2px; height:1.15em; background:var(--accent); margin-left:2px; animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .pitch{margin-top:16px; color:var(--ink-soft); max-width:58ch; font-size:16px;}
  .cta{margin-top:24px; display:flex; gap:12px; flex-wrap:wrap;}

  .hero .in-up{animation:inup .9s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--d,0) * 1ms);}
  @keyframes inup{from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:none;}}

  @media (max-width:680px){
    .hero{grid-template-columns:1fr; padding:24px; gap:22px; border-radius:26px;}
    .portrait{width:112px;}
  }

  /* ---------- ticker ---------- */
  .ticker{
    margin-top:16px; overflow:hidden; border-radius:18px; padding:14px 0;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  }
  .track{display:flex; gap:12px; width:max-content; animation:marquee 34s linear infinite;}
  .ticker:hover .track{animation-play-state:paused;}
  .track span{
    font-family:var(--font-mono); font-size:13px; font-weight:500; color:var(--ink-soft);
    padding:7px 16px; border-radius:999px; background:var(--card-2); border:1px solid var(--line); white-space:nowrap;
  }
  .track span:nth-child(3n+1){color:var(--accent);}
  .track span:nth-child(3n+2){color:var(--mint);}
  @keyframes marquee{to{transform:translateX(calc(-50% - 6px));}}

  /* ---------- stats ---------- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:16px;}
  .stat{padding:20px 22px;}
  .stat .k{font-family:var(--font-mono); font-size:11px; letter-spacing:.07em; color:var(--muted);}
  .stat .v{font-family:var(--font-display); font-weight:700; font-size:26px; margin-top:6px; letter-spacing:-.02em; overflow-wrap:anywhere; line-height:1.15;}
  .stat .v small{font-size:15px; font-weight:600; color:var(--ink-soft); margin-left:4px;}
  .stat:nth-child(1) .v{color:var(--accent);}
  @media (max-width:820px){ .stats{grid-template-columns:1fr 1fr;} }

  /* ---------- grids ---------- */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .about p{color:var(--ink-soft);}
  .about p + p{margin-top:12px;}
  @media (max-width:820px){ .grid-2{grid-template-columns:1fr;} }

  /* ---------- experience ---------- */
  .job-top{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:flex-start;}
  .job-co{font-family:var(--font-display); font-weight:700; font-size:23px; letter-spacing:-.01em;}
  .job-title{font-weight:600; margin-top:4px; color:var(--accent);}
  .job-meta{font-size:13px; color:var(--muted); text-align:right;}
  .job-meta b{display:inline-flex; align-items:center; gap:7px; margin-top:8px; color:var(--mint); background:var(--mint-soft); font-weight:600; padding:5px 12px; border-radius:999px;}
  .job-list{list-style:none; margin:22px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:12px; position:relative;}
  .job-list li{
    background:var(--card-2); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px 16px 48px; color:var(--ink-soft); font-size:14.5px; position:relative;
    transition:transform .25s ease, border-color .25s ease;
  }
  .job-list li:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 40%, var(--line));}
  .job-list li::before{
    content:""; position:absolute; left:18px; top:20px; width:14px; height:14px; border-radius:50%;
    background:var(--grad); box-shadow:0 0 0 4px var(--accent-soft);
  }
  @media (max-width:820px){ .job-list{grid-template-columns:1fr;} .job-meta{text-align:left;} }

  .job-proj{margin-top:18px; color:var(--ink-soft); font-size:14.5px;}
  .job-proj b{color:var(--ink);}
  .job-proj p + p{margin-top:8px;}
  .window + .window{margin-top:14px;}

  /* ---------- project ---------- */
  .window{padding:0; overflow:hidden;}
  .window:hover{transform:translateY(-3px);}
  .window-bar{display:flex; align-items:center; gap:7px; padding:12px 18px; background:var(--card-2); border-bottom:1px solid var(--line);}
  .dot{width:11px; height:11px; border-radius:50%;}
  .dot:nth-child(1){background:#ff6b6b;} .dot:nth-child(2){background:#ffc14d;} .dot:nth-child(3){background:#38d39f;}
  .window-name{margin-left:10px; font-family:var(--font-mono); font-size:12px; color:var(--muted);}
  .window-body{padding:28px;}
  .proj-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
  .proj-head h3{font-size:30px;}
  .proj-role{font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--accent); background:var(--accent-soft); padding:6px 12px; border-radius:999px;}
  .proj-desc{margin-top:12px; color:var(--ink-soft); max-width:64ch;}
  .proj-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:26px; margin-top:24px;}
  .h{font-family:var(--font-mono); font-size:11.5px; color:var(--muted); letter-spacing:.07em; margin-bottom:12px;}
  .feature-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .feature{
    font-size:14px; font-weight:500; border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--bg);
    display:flex; align-items:center; gap:10px; transition:transform .2s ease, border-color .2s;
  }
  .feature::before{content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--grad);}
  .feature:hover{transform:translateX(3px); border-color:color-mix(in srgb, var(--accent) 40%, var(--line));}
  .resp{margin-top:20px; color:var(--ink-soft); font-size:14.5px;}
  .resp b{color:var(--ink);}
  @media (max-width:820px){ .proj-grid{grid-template-columns:1fr;} }
  @media (max-width:440px){ .feature-grid{grid-template-columns:1fr;} .window-body{padding:20px;} }

  /* ---------- education ---------- */
  .edu .deg{font-family:var(--font-display); font-weight:700; font-size:26px;}
  .edu .school{color:var(--ink-soft); margin-top:4px;}
  .edu .when{margin-top:16px; display:inline-block; font-family:var(--font-mono); font-size:12px; font-weight:500; color:var(--spark); background:rgba(255,138,76,.13); padding:5px 12px; border-radius:999px;}

  /* ---------- contact ---------- */
  .contact-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .contact .k{font-family:var(--font-mono); font-size:11px; letter-spacing:.07em; color:var(--muted);}
  .contact .v{margin-top:8px; font-weight:600; font-size:16px; overflow-wrap:anywhere;}
  .copybtn{
    margin-top:14px; font-family:var(--font-body); font-weight:600; font-size:12.5px; border:1px solid var(--line-strong);
    background:transparent; color:var(--ink-soft); border-radius:999px; padding:7px 14px; cursor:pointer;
    transition:color .2s, border-color .2s, background .2s;
  }
  .copybtn:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-soft);}
  .avail-card{
    margin-top:14px; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;
    background:var(--grad); border:none; color:#fff; overflow:hidden; isolation:isolate; padding:32px;
  }
  .avail-card::after{
    content:""; position:absolute; width:260px; height:260px; border-radius:50%; right:-60px; top:-120px;
    background:rgba(255,255,255,.16); z-index:-1; animation:drift2 14s ease-in-out infinite;
  }
  .avail-card:hover{transform:translateY(-3px); border:none;}
  .avail-card h3{color:#fff; font-size:28px;}
  .avail-card p{margin-top:8px; color:rgba(255,255,255,.9); max-width:54ch;}
  .avail-card .btn{background:#fff; color:#1646c9; border-color:#fff;}
  @media (max-width:820px){ .contact-grid{grid-template-columns:1fr;} }

  footer{
    margin-top:48px; padding-block:24px max(36px, env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line); font-size:13px; color:var(--muted);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .blob,.portrait::before,.live::after,.caret,.avail-card::after{animation:none;}
    .track{animation:none; width:auto; flex-wrap:wrap; padding-inline:14px;}
    .ticker{-webkit-mask-image:none; mask-image:none;}
    .her
